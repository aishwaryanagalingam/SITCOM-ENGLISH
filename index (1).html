<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Learn English idioms and new words from funny sitcom-style scenes with AI tutors you can talk to.">
<title>SitcomEnglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout concept: a 1970s sitcom set. Home is a retro TV with a channel guide, the series page is the opening
     credits, the room is the studio floor (monitor, laugh track, script). Hard outlines and offset shadows, like a title card. */
  :root{
    --paper:#FFF3DC; --card:#FFFBF2; --ink:#2A1738; --muted:#6E5A78; --outline:#2A1738; --shadow:#2A1738;
    --orange:#FF6B1A; --mustard:#FFC83D; --teal:#0F9D8C; --pink:#FF5C8A; --blue:#3A6BFF; --btn-ink:#1B0B26;
    --crt:#15101F; --crt-ink:#F6F0FF; --focus:#3A6BFF;
    --disp:"Bowlby One","Arial Black",Impact,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#150D22; --card:#241638; --ink:#FFF3DC; --muted:#BBA9CC; --outline:#8B6BC4; --shadow:#07030E; --crt:#0C0814; --focus:#9DB6FF;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#150D22; --card:#241638; --ink:#FFF3DC; --muted:#BBA9CC; --outline:#8B6BC4; --shadow:#07030E; --crt:#0C0814; --focus:#9DB6FF;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
    background-image:radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
  h1,h2,h3,p,blockquote{margin:0}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .kicker{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .pop{background:var(--card);border:3px solid var(--outline);border-radius:18px;box-shadow:6px 6px 0 var(--shadow);min-width:0}

  /* header + ticker */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--outline)}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;min-height:64px;padding-block:8px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stripe{height:10px;background:linear-gradient(90deg,var(--orange) 0 25%,var(--mustard) 25% 50%,var(--teal) 50% 75%,var(--pink) 75%)}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:22px;line-height:1}
  .logo svg{width:42px;height:42px;flex:none}
  .logo .en{color:var(--orange)}
  .top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-family:var(--mono);font-weight:700;font-size:13px;border:2.5px solid var(--outline);border-radius:99px;padding:3px 12px;background:var(--mustard);color:var(--btn-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.t{background:var(--teal);color:#fff}

  main{max-width:1180px;margin:0 auto;padding-block:30px 64px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* buttons */
  .btn{background:var(--orange);color:var(--btn-ink);border:3px solid var(--outline);border-radius:14px;padding:9px 18px;font-weight:700;letter-spacing:.02em;
    box-shadow:4px 4px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--shadow)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:4px 4px 0 var(--shadow)}
  .btn.alt{background:var(--mustard)}
  .ghost{background:var(--card);color:var(--ink);border:3px solid var(--outline);border-radius:14px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--shadow)}
  .ghost:hover{background:var(--mustard);color:var(--btn-ink)}

  /* home */
  .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(32px,6.4vw,68px);line-height:1.04;max-width:900px;text-wrap:balance}
  .hl{background:var(--mustard);color:var(--btn-ink);padding:0 .2em;border:3px solid var(--outline);border-radius:12px;display:inline-block;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--shadow)}
  .hero .sub{font-size:18px;color:var(--muted);max-width:560px;text-wrap:balance}
  .tvwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:36px;align-items:center;margin-top:62px}
  @media (max-width:880px){.tvwrap{grid-template-columns:minmax(0,1fr);margin-top:56px}}
  .tv{position:relative;background:var(--orange);border:3px solid var(--outline);border-radius:34px;padding:18px 18px 12px;box-shadow:9px 9px 0 var(--shadow)}
  .tv::before,.tv::after{content:"";position:absolute;top:-50px;width:5px;height:64px;background:var(--outline);border-radius:3px;transform-origin:bottom}
  .tv::before{left:34%;transform:rotate(-26deg)}.tv::after{right:34%;transform:rotate(26deg)}
  .screen{--c:#3A6BFF;position:relative;aspect-ratio:4/3;min-height:300px;width:100%;min-width:0;border-radius:24px/28px;overflow:hidden;border:3px solid var(--outline);isolation:isolate;
    background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 60%,var(--crt)),var(--crt));color:var(--crt-ink)}
  .screen::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
  @media (max-width:520px){.screen{aspect-ratio:auto;min-height:320px}.scr-main{max-width:100%}.scr-cast{opacity:.9}.scr-cast>div{width:clamp(64px,20vw,90px)}.tv{padding:14px 12px 10px}}
  .static{position:absolute;inset:0;z-index:6;opacity:0;pointer-events:none;background-size:160px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .static.on{animation:static .42s steps(7) 1}
  @keyframes static{0%{opacity:.95;background-position:0 0}30%{background-position:-60px 40px}60%{opacity:.7;background-position:30px -50px}100%{opacity:0;background-position:-40px 20px}}
  .scr-in{position:relative;z-index:2;height:100%;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
  .chnum{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mustard)}
  .scr-main{display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:62%}
  .scr-emoji{font-size:40px;line-height:1}
  .scr-title{font-family:var(--disp);font-weight:400;font-size:clamp(26px,4.2vw,44px);line-height:1.02}
  .scr-about{font-size:14px;opacity:.9}
  .scr-cast{position:absolute;right:10px;bottom:-8px;display:flex;align-items:flex-end;z-index:1}
  .scr-cast>div{width:clamp(80px,17vw,130px)}
  .scr-cast svg{width:100%;height:auto;display:block}
  .knobs{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 10px 0}
  .knob{width:26px;height:26px;border-radius:50%;background:var(--mustard);border:3px solid var(--outline)}
  .grille{flex:1;height:14px;background:repeating-linear-gradient(90deg,var(--outline) 0 3px,transparent 3px 9px);opacity:.75;border-radius:3px}
  .remote{padding:20px;display:flex;flex-direction:column;gap:10px;transform:rotate(1.2deg)}
  @media (max-width:880px){.remote{transform:none}}
  .rh{font-family:var(--mono);font-size:13px;letter-spacing:.16em;margin-bottom:4px}
  .chlist{display:flex;flex-direction:column;gap:8px}
  .ch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:8px 12px;border:2.5px solid var(--outline);border-radius:12px;background:var(--card);font-weight:700}
  .ch .num{font-family:var(--mono);font-size:13px;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 7px}
  .ch:hover{background:color-mix(in srgb,var(--mustard) 40%,var(--card))}
  .ch.on{background:var(--mustard);color:var(--btn-ink);box-shadow:3px 3px 0 var(--shadow);transform:translate(-2px,-2px)}
  .note{text-align:center;margin-top:44px;font-size:13px;color:var(--muted)}

  /* opening credits (tutor pick) */
  .titlecard{background:var(--c);color:#fff;border:3px solid var(--outline);border-radius:22px;box-shadow:8px 8px 0 var(--shadow);padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 14px,transparent 14px 28px)}
  .titlecard .kicker{color:#fff;opacity:.9}
  .titlecard h1{font-family:var(--disp);font-weight:400;font-size:clamp(30px,6vw,64px);line-height:1.05;text-shadow:4px 4px 0 rgba(0,0,0,.35);text-wrap:balance}
  .cast{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),340px));justify-content:center;margin-top:44px}
  .cc{padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
  .cc.l{transform:rotate(-1.6deg)}.cc.r{transform:rotate(1.6deg)}
  .cc:hover{transform:rotate(0) translateY(-6px)}
  .cc-pic{--spd:1;height:220px;border:3px solid var(--outline);border-radius:12px;background:var(--aura);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
    background-image:radial-gradient(rgba(255,255,255,.28) 2px,transparent 2.5px);background-size:16px 16px}
  .cc-pic svg{width:190px;height:auto;display:block;margin-bottom:-14px}
  .cc h3{font-family:var(--disp);font-weight:400;font-size:28px;margin-top:8px;line-height:1.1}
  .role{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  blockquote{font-style:italic;color:var(--muted);font-size:14px;min-height:62px;border-left:4px solid var(--aura);padding-left:10px}
  .cc .btn{margin-top:8px}
  .meter{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;font-weight:700;margin:4px 0}
  .bars{display:inline-flex;align-items:flex-end;gap:3px}
  .bars i{width:9px;height:var(--h);border:2px solid var(--outline);background:var(--card);border-radius:3px;display:inline-block}

  /* studio floor (room) */
  .set{display:grid;gap:22px;align-items:start;grid-template-columns:minmax(0,250px) minmax(0,1fr);grid-template-areas:"c m"}
  .c-card{grid-area:c;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .eps{grid-area:e;padding:16px}
  .r-main{grid-area:m;display:flex;flex-direction:column;gap:18px;min-width:0}
  @media (max-width:880px){.set{grid-template-columns:minmax(0,1fr);grid-template-areas:"c" "m"}}
  .cpic{--size:140px;width:calc(var(--size) + 22px);height:calc(var(--size) + 22px);border-radius:50%;border:3px solid var(--outline);display:grid;place-items:end center;overflow:hidden;
    background:color-mix(in srgb,var(--aura) 40%,var(--card));animation:aura calc(2.6s / var(--spd,1)) ease-in-out infinite}
  .cpic svg{width:var(--size);height:auto;display:block;margin-bottom:-10px}
  .talking .cpic{animation-duration:calc(1s / var(--spd,1))}
  .c-card h3{font-family:var(--disp);font-weight:400;font-size:24px;margin-top:8px}
  .eps h3,.sect{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .season{font-family:var(--mono);font-size:12px;color:var(--muted);margin:6px 0 8px}
  .prog{height:12px;border:2.5px solid var(--outline);border-radius:99px;background:var(--paper);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--teal);border-right:2.5px solid var(--outline);transition:width .5s}
  .eplist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .ep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:6px 10px;border:2.5px solid var(--outline);border-radius:10px;background:var(--card);font-size:14px;font-weight:500}
  .ep .n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
  .ep:hover{background:color-mix(in srgb,var(--mustard) 35%,var(--card))}
  .ep.on{background:var(--mustard);color:var(--btn-ink);font-weight:700}.ep.on .n{color:var(--btn-ink)}
  .ep .ok{font-weight:700;color:var(--teal)}.ep.on .ok{color:var(--btn-ink)}

  .mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .ep-title{font-family:var(--disp);font-weight:400;font-size:clamp(22px,3.4vw,34px);line-height:1.1;margin-top:6px}
  .tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:2px solid var(--outline);background:var(--pink);color:var(--btn-ink);text-transform:uppercase;letter-spacing:.06em}
  .monitor{position:relative;background:var(--crt);border:3px solid var(--outline);border-radius:20px;box-shadow:7px 7px 0 var(--shadow);overflow:hidden;color:var(--crt-ink)}
  .monitor::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  .mbar{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border-bottom:2px solid rgba(255,255,255,.18)}
  .rec{display:inline-flex;align-items:center;gap:7px}
  .rec i{width:10px;height:10px;border-radius:50%;background:#ff3b3b;animation:blinkdot 1.2s steps(2) infinite}
  @keyframes blinkdot{50%{opacity:.2}}
  .stage{--c:#FF6B1A;position:relative;height:clamp(250px,36vw,330px);overflow:hidden;
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 38%,var(--crt)) 0 68%,color-mix(in srgb,var(--c) 18%,var(--crt)) 68% 100%)}
  .prop{position:absolute;font-size:30px;transform:translateY(-50%)}
  .actor{position:absolute;bottom:30px;width:clamp(96px,19%,150px)}
  .actor.a{left:6%}.actor.b{right:6%;transform:scaleX(-1)}
  .actor svg{width:100%;height:auto;display:block}
  .chyron{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:stretch;background:rgba(10,6,20,.86);border-top:3px solid var(--mustard);min-height:60px}
  .who{background:var(--mustard);color:#1B0B26;font-family:var(--mono);font-weight:700;font-size:13px;padding:8px 12px;text-transform:uppercase;display:flex;align-items:center;white-space:nowrap}
  .line{padding:8px 14px;font-family:var(--mono);font-size:14px;line-height:1.45;display:flex;align-items:center}
  .w.hid{opacity:0}.w.m{background:var(--pink);color:#1B0B26;border-radius:4px;padding:0 3px;font-weight:700}
  .clap{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:rgba(10,6,20,.6)}
  .clap.show{display:grid}
  .board{width:210px;border:3px solid #fff;border-radius:8px;background:#1a1a1a;color:#fff;font-family:var(--mono);font-weight:700;text-align:center;overflow:visible;position:relative;padding-top:30px;padding-bottom:12px}
  .stick{position:absolute;left:-3px;right:-3px;top:-3px;height:30px;border:3px solid #fff;border-radius:6px;transform-origin:left bottom;
    background:repeating-linear-gradient(115deg,#fff 0 16px,#1a1a1a 16px 32px);animation:stick .9s ease-out forwards}
  @keyframes stick{0%,45%{transform:rotate(-24deg)}62%,100%{transform:rotate(0)}}
  .laugh-old{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border:3px solid var(--outline);border-radius:14px;background:var(--card)}
  .lbars{display:flex;align-items:flex-end;gap:4px;height:34px;flex:1;min-width:120px}
  .lbars i{flex:1;height:6px;background:var(--teal);border:2px solid var(--outline);border-radius:3px}
  .laugh.go .lbars i{animation:lb .38s ease-in-out infinite alternate;animation-delay:calc(var(--k) * 40ms)}
  @keyframes lb{from{height:6px}to{height:calc(12px + var(--k) * 2px + 8px)}}
  .sign{font-family:var(--disp);font-size:15px;padding:3px 12px;border:3px solid var(--outline);border-radius:8px;background:var(--paper);color:var(--muted);transition:.2s}
  .sign.go{background:var(--mustard);color:var(--btn-ink);box-shadow:0 0 18px 3px var(--mustard);animation:flash .4s steps(2) infinite}
  @keyframes flash{50%{box-shadow:0 0 6px 0 var(--mustard)}}

  .clues{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
  .clue{border:3px solid var(--outline);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--shadow);font-size:15px}
  .clue .mono{display:block;margin-bottom:4px;font-weight:700}
  .c1{background:color-mix(in srgb,var(--mustard) 38%,var(--card))}.c2{background:color-mix(in srgb,var(--teal) 28%,var(--card))}.c3{background:color-mix(in srgb,var(--pink) 28%,var(--card))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toast{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--teal)}

  .script{display:flex;flex-direction:column;height:min(60vh,540px);min-height:380px;overflow:hidden}
  .script-h{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:9px 14px;border-bottom:3px solid var(--outline)}
  .log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:min(88%,640px);padding:8px 14px 10px;border:2.5px solid var(--outline);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);overflow-wrap:anywhere}
  .msg .nm{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .msg .tx{white-space:pre-wrap;line-height:1.5}
  .msg.ai{background:var(--card);align-self:flex-start}
  .msg.me{background:var(--mustard);color:var(--btn-ink);align-self:flex-end}
  .msg.me .nm{color:#4a3600}
  .msg.typing .tx{opacity:.65;font-style:italic}
  .bar{display:flex;gap:10px;padding:12px;border-top:3px solid var(--outline);background:color-mix(in srgb,var(--mustard) 14%,var(--card))}
  .bar input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--outline);border-radius:12px;padding:9px 12px}
  .bar input::placeholder{color:var(--muted)}

  /* avatar motion */
  .av{animation:bob calc(3.2s / var(--spd,1)) ease-in-out infinite}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  .mouth{transform-box:fill-box;transform-origin:center}
  .talking .mouth{animation:talk calc(.22s / var(--spd,1)) ease-in-out infinite alternate}
  .talking .av{animation:bobtalk calc(.5s / var(--spd,1)) ease-in-out infinite}
  .thinking .brow{transform:translateY(-4px)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes bobtalk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(.8deg)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(2.4)}}
  @keyframes aura{0%,100%{box-shadow:0 0 0 0 var(--aura)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--aura) 35%,transparent)}}

  /* declutter additions */
  .c-card{position:sticky;top:96px}
  @media (max-width:880px){.c-card{position:static}}

/* ============ VOICES: female tutors get a female voice, male tutors a male voice ============ */
let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[]}catch(e){VOICES=[]}}
loadVoices();
try{window.speechSynthesis&&speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}
const FEM=/female|woman|samantha|zira|susan|karen|moira|tessa|victoria|fiona|aria|jenny|hazel|libby|heera|veena|catherine|allison|ava\b|joanna|kendra|salli|serena|sonia|natasha|linda|google us english/i;
const MAL=/\bmale\b|david|mark\b|daniel|alex\b|fred\b|george|guy\b|ryan|james|rishi|thomas|oliver|arthur|brian|matthew|reed|eddy|rocko|ravi|prabhat/i;
function pickVoice(t){
  const en=VOICES.filter(v=>/^en/i.test(v.lang));
  if(t.g==="f")return en.find(v=>FEM.test(v.name))||null;
  return en.find(v=>MAL.test(v.name)&&!/female/i.test(v.name))||null;
}
function utter(text,t){
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";
  const v=pickVoice(t);
  if(v){u.voice=v;u.lang=v.lang;u.pitch=1+(t.voice[0]-1)*.4}
  else u.pitch=t.g==="f"?Math.max(1.25,t.voice[0]):Math.min(.7,t.voice[0]);
  u.rate=t.voice[1];
  return u;
}

/* ============ SOUND: a tiny laugh track made from filtered noise ============ */
let actx=null;
function laughSound(){
  const sign=$("#laugh");
  if(sign){sign.classList.add("go");setTimeout(()=>sign.classList.remove("go"),1500)}
  if(!laughOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const len=actx.sampleRate*1.4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=actx.createBufferSource();src.buffer=buf;
    const f=actx.createBiquadFilter();f.type="bandpass";f.frequency.value=1100;f.Q.value=.7;
    const g=actx.createGain(),t0=actx.currentTime;
    g.gain.setValueAtTime(0,t0);
    for(let k=0;k<7;k++){const t=t0+k*.17;g.gain.linearRampToValueAtTime(.16-k*.012,t+.04);g.gain.linearRampToValueAtTime(.03,t+.14)}
    g.gain.linearRampToValueAtTime(0,t0+1.3);
    src.connect(f);f.connect(g);g.connect(actx.destination);src.start();
  }catch(e){}
}

  if(!vc||rec)return;

  try{

    };

function sceneFor(p){

  return [["a",ex],["b","Wait, what does “[["+p.phrase+"]]” mean?"],["a","It means: "+p.meaning.charAt(0).toLowerCase()+p.meaning.slice(1)]];

const PROPS={office:["🖥️","☕"],modern:["🛋️","🖼️"],friends:["☕","🛋️"],bigbang:["🧪","🔬"],b99:["📋","🚓"],parks:["🌳","🏛️"]};

  const out=[];let m=false;

    if(seg==="[[")m=true;else if(seg==="]]")m=false;

}

/* Built-in tutor brain: used when the AI connection is not available in this view. */
let quiz=null,offNote=false;
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function flav(ok){const L=tutor.energy.level;return ok?(L>=4?"Boom! ":L<=2?"Not bad. ":"Nice! "):(L>=4?"Ooh! ":L<=2?"Hmm. ":"Okay! ")}
function findIdiom(text){const t=text.toLowerCase();let best=null;for(const p of PHRASES){const k=p.phrase.toLowerCase();if(t.includes(k)&&(!best||k.length>best.phrase.length))best=p}return best}
const STOP=["what","does","mean","means","meaning","idiom","explain","about","tell","with","this","that","word","phrase","artham","please","teach"];
function searchIdiom(text){
  const ws=text.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(w=>w.length>3&&!STOP.includes(w));if(!ws.length)return null;
  let best=null,sc=0;
  for(const p of PHRASES){const k=p.phrase.toLowerCase(),h=k+" "+p.meaning.toLowerCase();let s=0;ws.forEach(w=>{if(k.includes(w))s+=3;else if(h.includes(w))s+=1});if(s>sc){sc=s;best=p}}
  return sc>=3?best:null;
}
function blank(p){const i=p.example.toLowerCase().indexOf(p.phrase.toLowerCase());return i<0?null:p.example.slice(0,i)+"_____"+p.example.slice(i+p.phrase.length)}
function nextIdiom(){const pool=tutor.idioms.filter(p=>!S.done[p.id]);const L=pool.length?pool:tutor.idioms;return L[Math.floor(Math.random()*L.length)]}
function explain(p){return `“${p.phrase}”: ${p.meaning}\nTamil: ${p.tamil}\nExample: ${p.example}`}
function askBlank(p){const b=blank(p);if(!b)return `Now write your own sentence with “${p.phrase}”.`;quiz=p;return `Fill in the blank with the idiom:\n“${b}”`}
function offlineTutor(text){
  const t=text.trim(),low=t.toLowerCase();
  if(/^Teach me "/.test(t)){const p=findIdiom(t);if(p)return explain(p)+"\n\n"+askBlank(p)}
  if(quiz){const q=quiz;quiz=null;
    return low.includes(q.phrase.toLowerCase())?`${flav(true)}Correct! “${q.phrase}” means ${lc(q.meaning)}\nType “quiz” for another one.`:`Not quite. The answer is “${q.phrase}”: ${lc(q.meaning)}\nType “quiz” to try another one.`}
  if(/\bquiz\b|test me/.test(low)){const pool=tutor.idioms.filter(p=>blank(p));const p=pool[Math.floor(Math.random()*pool.length)];quiz=p;return `Fill in the blank with the idiom:\n“${blank(p)}”\nHint: ${p.meaning}`}
  const asking=/\bwhat\b|\bmean|explain|artham|\bwhy\b|\bhow\b/.test(low);
  const used=findIdiom(t);
  if(used&&!asking){const n=nextIdiom();return `${flav(true)}You used “${used.phrase}” (${lc(used.meaning)})\nNext one: “${n.phrase}”. Do you know what it means? Ask me, or type “quiz”.`}
  if(asking){const p=used||searchIdiom(t);
    if(p)return explain(p)+"\nYour turn: write your own sentence with it!";
    return `${flav(false)}I couldn't find that one in my library. Tap 📚 Idioms and search, or ask me about one of ${tutor.name}'s idioms.`}
  if(/^(hi|hello|hey|hai|hii|yo|good (morning|evening|afternoon))\b/.test(low)){const n=nextIdiom();return `${flav(true)}Hello! Let's learn something. Today's idiom is “${n.phrase}”: ${lc(n.meaning)} Ask me about it, or type “quiz”.`}
  const n=nextIdiom();
  return `${flav(true)}Let's use your words to learn. Today's idiom: “${n.phrase}”\n${n.meaning}\nExample: ${n.example}\nNow write your own sentence with it!`;
}
function offlineReply(t,err){
  const code=err&&err.code;
  const why=code==="network"?"I can't reach the AI server. Open this site through the server (npm start, then http://localhost:3000), not by opening the file directly."
    :code==="rate_limited"?"Too many messages in a short time. Try again in a few minutes."
    :"The AI server returned an error. Check the API key and the server window for details.";
  let r=offlineTutor(t);
  if(!offNote||code!=="network"){offNote=true;r+="\n\n("+why+" Until then I'm using my built-in brain.)"}
  return r;
}
function checkUsed(text){
  if(!curPhrase||/^(Teach me|I want to practise|The learner)/.test(text))return;
  if(text.toLowerCase().includes(curPhrase.phrase)&&!S.done[curPhrase.id]){
    S.done[curPhrase.id]=true;addXP(20);
    progress();laughSound();
    const t=$("#toast");if(t)t.innerHTML=`<span class="toast">👏 You used “${esc(curPhrase.phrase)}”! +20 XP</span>`;
  }
}

/* ============ START ============ */
renderStats();
showHome();
</script>
